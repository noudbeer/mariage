# Avant le premier démarrage, préparer les fichiers de données sur l'hôte :
#   touch data/rsvp.db && chmod 666 data/rsvp.db
# Le conteneur tourne avec un utilisateur non-root (uid 1001) : sans ce chmod, l'écriture
# dans rsvp.db (bind-mount d'un fichier hôte) échoue avec "attempt to write a readonly database".

services:
  mariage-web:
    build: .
    image: mariage-tiffany-simon:latest
    container_name: mariage-web
    restart: unless-stopped
    # Une seule réplique : le rate limiting de /connexion est en mémoire (voir src/lib/rateLimit.ts).
    deploy:
      replicas: 1
    env_file:
      - .env
    volumes:
      - ./data/guests.json:/app/data/guests.json:ro
      - ./data/temoins.json:/app/data/temoins.json:ro
      - ./data/rsvp.db:/app/data/rsvp.db
      - ./public/photos:/app/public/photos:ro

# Déploiement en prod (image GHCR + réseau Caddy partagé, sans build local) : voir le README
# (section « CI/CD ») — le serveur garde son propre docker-compose.yml, distinct de celui-ci.
